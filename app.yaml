# Databricks App that hosts the FastAPI backend (plan WS2 step 9). Deploy steps: README.md, "Host the API on Databricks".
# Databricks doesn't run this in a shell; it substitutes only $DATABRICKS_APP_PORT. Packages come from requirements.txt.
# --forwarded-allow-ips "*": uvicorn then takes the client from the left-most X-Forwarded-For entry, which the
# laptop's proxy sets to the real visitor IP, so the per-IP upload limit works. Trusting every hop is safe here
# because only callers Databricks has already authenticated can reach the app.
command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "$DATABRICKS_APP_PORT",
          "--forwarded-allow-ips", "*"]

env:
  # DATABRICKS_HOST and the app's service-principal credentials are set by the platform, so the API runs
  # against the real tables. Keep that explicit:
  - name: REALDEAL_MOCK
    value: "0"
  # Keys below are app resources added when the app is created (README lists them).
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: ANTHROPIC_API_KEY
    valueFrom: anthropic-api-key
  - name: ELEVENLABS_API_KEY
    valueFrom: elevenlabs-api-key
