[project]
name = "realdeal"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "anthropic>=0.75",
  "databricks-sdk>=0.60",
  "pillow>=13.0.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["shared", "apps/api", "databricks"]

[tool.ruff]
line-length = 120
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
