" y="64" width="12" height="24" fill="#35D0A0"/></g><g transform="translate(0,0)" transform-origin="0 0"><g class="row" style="animation-delay:1.00s"><text x="520" y="204" font-size="22" font-weight="600" fill="#D8F5EA">Read the repo</text><g class="busy" style="animation-delay:1.00s"><path class="spin" d="M486 186a9 9 0 1 1-9 9" fill="none" stroke="#35D0A0" stroke-width="3" stroke-linecap="round"/></g><g class="tick" style="animation-delay:1.00s"><circle cx="486" cy="196" r="11" fill="#35D0A0"/><path d="M480 196l4 4 8-9" fill="none" stroke="#06231A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g class="row" style="animation-delay:2.50s"><text x="520" y="246" font-size="22" font-weight="600" fill="#D8F5EA">Plan the change</text><g class="busy" style="animation-delay:2.50s"><path class="spin" d="M486 228a9 9 0 1 1-9 9" fill="none" stroke="#35D0A0" stroke-width="3" stroke-linecap="round"/></g><g class="tick" style="animation-delay:2.50s"><circle cx="486" cy="238" r="11" fill="#35D0A0"/><path d="M480 238l4 4 8-9" fill="none" stroke="#06231A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g class="row" style="animation-delay:4.00s"><text x="520" y="288" font-size="22" font-weight="600" fill="#D8F5EA">Edit the files</text><g class="busy" style="animation-delay:4.00s"><path class="spin" d="M486 270a9 9 0 1 1-9 9" fill="none" stroke="#35D0A0" stroke-width="3" stroke-linecap="round"/></g><g class="tick" style="animation-delay:4.00s"><circle cx="486" cy="280" r="11" fill="#35D0A0"/><path d="M480 280l4 4 8-9" fill="none" stroke="#06231A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g class="row" style="animation-delay:5.50s"><text x="520" y="330" font-size="22" font-weight="600" fill="#D8F5EA">Run the tests</text><g class="busy" style="animation-delay:5.50s"><path class="spin" d="M486 312a9 9 0 1 1-9 9" fill="none" stroke="#35D0A0" stroke-width="3" stroke-linecap="round"/></g><g class="tick" style="animation-delay:5.50s"><circle cx="486" cy="322" r="11" fill="#35D0A0"/><path d="M480 322l4 4 8-9" fill="none" stroke="#06231A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></svg>