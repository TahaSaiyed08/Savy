<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" style="--h:590px;--y0:-90px"><style>
.bar{transform-box:fill-box;transform-origin:center;animation:wave var(--d) ease-in-out infinite alternate}
